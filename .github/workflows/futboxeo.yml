name: Build Futboxeo APK

on:
  workflow_dispatch:
  push:
    paths:
      - futbol-boxeo/**
      - .github/workflows/futboxeo.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK de Android (ya viene instalado)
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK de depuración
        working-directory: futbol-boxeo
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: futboxeo-debug-apk
          path: futbol-boxeo/app/build/outputs/apk/debug/*.apk

      - name: Publicar versión (sin marcarla como la última, para no afectar al reproductor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp futbol-boxeo/app/build/outputs/apk/debug/app-debug.apk futboxeo.apk
          gh release create "futboxeo-${{ github.run_number }}" futboxeo.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Futboxeo ${{ github.run_number }}" \
            --notes "Juego de fútbol + boxeo. Descarga futboxeo.apk e instálalo en tu Android." \
            --latest=false
