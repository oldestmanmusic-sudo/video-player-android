name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - video-player-android.zip
      - .github/workflows/main.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -q video-player-android.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK de Android (ya viene instalado)
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK de depuración
        working-directory: video-player-android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: video-player-debug-apk
          path: video-player-android/app/build/outputs/apk/debug/*.apk

      - name: Publicar versión (la usa el botón Actualizar de la app)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp video-player-android/app/build/outputs/apk/debug/app-debug.apk video-player.apk
          gh release create "build-${{ github.run_number }}" video-player.apk \
            --repo "${{ github.repository }}" \
            --title "Versión ${{ github.run_number }}" \
            --notes "APK de depuración compilada automáticamente" \
            --latest
